[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cashterm_core"
version = "0.1.0"
requires-python = ">=3.10"
description = "Rust terminal core (alacritty_terminal) for Cash Terminal, via pyo3"
# PEP 621 table form, not the newer PEP 639 bare string: the distro ships
# maturin 1.3.2, which predates PEP 639 support and would reject the string.
license = { text = "Apache-2.0" }

[tool.maturin]
# Build as a Python extension module (the cdylib named cashterm_core).
features = ["pyo3/extension-module"]
